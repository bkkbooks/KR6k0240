body:
  text: 清廣州寶象林釋迦沙門弘贊集供天一法本出金光明經修懺時設供三寶諸天然其檀場惟安功德天座於佛左邊道場若覺更安大辯四王座於佛右邊若準新經令畫天像至於請時位序主客尊卑次則總請八部後乃三請功德天七誦天呪以召天女及其徒屬以此天是道場法門主故古師列十六諸天後增日月龍王閻羅為二十今人增至二十四既無位座亦失次序若修懺時請懺法中自有恒式今雖非修懺惟是設供亦須知位次尊卑論言行則功德大辯為尊論主領則梵釋居先茲按懺法事當尊主復檢新舊兩經兼請八部乃至風火水神方合經旨此不別列風等以彼是八部所屬請八部即已兼之中有雖非對揚而皆赴集金光明會愛樂大乘流通正法大有呵護之功昔神煥法師曰世人論天或十二或十六或十八皆準鬼神品增減無拘也今欲定尊卑亦良為難如鬼子母羅剎也豈當與大梵同列有女名功德男名散脂今有以功德居上梵釋次之後列散脂鬼母豈非失序因檢討大藏作諸天傳隨位釋之蓋天有主客有男女有本迹有顯晦梵王為三界主帝釋為忉利主四王為八部主若功德大辯但客寄耳功德寄北天大辯寄山澤初無主領茲所謂主客也功德大辯樹神地神摩利鬼母並女質餘則男身所謂男女也金剛密迹五百徒黨皆大菩薩本也現居神位迹也所謂本迹也大辯對佛宜揚正法雖位處客寄身示女質而言行則顯或但作影響不事敷揚縱權有統主現丈夫形而言行則晦所謂顯晦也知此四端可與言天矣今按懺法及天傳條列於左俾無失序也一淨水讚如常可知二誦呪灑淨壇場誦大悲咒或三遍七遍隨意次稱云南無本師釋迦牟尼佛三稱三表白胡跪白言恭惟如來御世不離本際而化被三千大千隨機利見而教設五乘十乘定慧莊嚴現自他受用之身光明遍照成幽顯俱沾之益一音演說眾得隨解為四生之慈父九界之獨尊機感緣至冥應若響故於金光明會上顯密齊彰天龍感益利樂無邊之眾某等自愧業緣障重不聞金口親宣幸植微因茲覩大雄之遺訓謹遵聖教敬陳蘋儀之微供恭奉三寶天龍八部一切聖眾伏願慈光俯降鑒我忱誠早獲解脫於苦津俾得頓超於樂地四禮請三寶心隨身口一心頂禮了知此身如影不實能禮所禮心無所得然後手擎香爐胡跪請言一心奉請毗盧遮那牟尼世尊不起真際為群生與眾俱來受供養眾同和云香花請香華請下和準此一心奉請金光明會上諸佛世尊并盡十方遍法界過現未來一切尊佛不起真際為群生與眾俱來受供養香華請香華請一心奉請金光明最勝王經并盡十方徧法界過現未來一切尊法我今三業如法請惟願顯現受供養香華請香華請一心奉請金光明會上諸大菩薩三乘聖眾并盡十方徧法界過現未來一切賢聖僧不起真際為群生與眾俱來受供養香華請香華請三請已起禮三拜五奉請諸天出家五眾於諸天處有請無跪拜在家當禮擎爐稱言南無光明會上護法諸天菩薩三稱畢請言一心奉請統御娑婆三界之主身心妙圓威儀明悟尸棄大梵王尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請須彌山頂三十三天主帝釋尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香花請一心奉請北方護世大藥叉主多聞尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請東方護世乾闥婆王持國尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請南方護世鳩槃茶王增長尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請西方護世統領諸龍廣目尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請誓護賢劫千佛金剛密跡主大力士尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請統御大千居色界頂極尊之主摩醘首羅尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請論尊此當首請而於光明會上非對揚也一心奉請擁護持經說呪利生欲界天主波旬魔王尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請了知一切諸法體性差別統領二十八部鬼神散脂藥叉大將尊天惟願暫離宮闕與諸眷屬來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請能與總持大智慧聚大辯才尊天惟願暫離宮闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請第一威德成就眾事大吉祥功德尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請內秘密行外護三洲利物弘化擁護四眾韋駄尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請出生地利百穀果蓏擁護持經堅牢地神尊天惟願暫離宮闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請守護覺場不離佛日菩提樹神尊天惟願暫離宮闕與諸眷屬來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請受佛教敕擁護人民五百神王母歡喜藥叉尊天惟願暫離宮闕與諸眷屬來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請行日月前救兵戈難護國祐民摩利支尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請週四天下千光破暗照育萬物日宮太陽寶光尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請旋四部洲千輝朗夜滋長萬物月宮太陰宿王明月尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請除諸災患殄眾怖畏阿揭多等四大電王尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請布密雲注甘雨守護諸佛法藏利國祐民娑竭羅阿耨達龍王尊天惟願暫離宮闕與諸眷屬來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請愛樂正法深心護持統領三萬六千夜叉神眾藥叉王蓮華面尊天惟願暫離宮闕與諸眷屬來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請深樂大乘流通正法以香資身乾闥婆王彩軍尊天惟願暫離天闕與諸天眷來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請誓護正法擁衛善人福樂鄰天阿修羅王毗摩質多尊天惟願暫離宮闕與諸眷屬來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請具大神力擁衛大乘經典金翅鳥王蘇羅尊天惟願暫離宮闕與諸眷屬來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請深護大乘樂聞正法緊那羅王香象勢力尊天惟願暫離天闕與諸眷屬來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請護持正法樂修上乘莫呼羅伽王大善見尊天惟願暫離宮闕與諸眷屬來赴凡筵不捨慈悲光臨法會香華請香華請一心奉請大權示現職掌幽冥泥犁地獄主閻魔羅王尊天惟願暫離宮闕與諸眷屬來赴凡筵不捨慈悲光臨法會香華請香華請若後誦楞嚴呪其呪有天龍八部之名不可無請當請云一心奉請楞嚴會上護法諸天八部聖眾惟願暫離天闕與諸眷屬來赴凡筵不捨慈悲光臨法會香華請香華請若不誦楞嚴呪即不在請也如上列名一一三請大善若其時速可再加二總請足前三請請云一心奉請金光明楞嚴會上護法諸天并諸眷屬天仙等眾惟願暫離天闕來赴凡筵不捨慈悲光臨法會香華請香華請二請畢安座白言上來敬請十方三寶天龍八部聖眾愍念凡情垂慈降臨惟願各安寶座如毗離耶淨名丈室處八萬四千師子之座拘尸城外娑羅林於一針鋒上坐無邊之眾伏以具勝吉祥成就眾事故建號為大功德天能與總持妙慧遂稱曰大辯才闡神通護正法是為金剛密迹推長於初禪天上亶作娑婆之主號曰大梵天王居色界頂統攝大千故稱名曰大自在帝釋尊居忉利特司下土之權四王住須彌山腹統領八部之神利物弘化護法安僧韋䭾將軍最先由是光明會上之聖眾方等示現之善權莫不輸誠立誓護法安人豈惟翼贊於當時特為扶持於末運伏願大闡神力助揚正化冥鑒物情歡納茲晨某檀那之菲供若出家者隨戒稱之密回聖照俯運悲懷憫群生之微誠仰冀普度於迷津早得遂心而解脫故我至誠一心歸命六誦呪若不誦楞嚴呪應初誦大悲呪灑淨畢即請三寶諸天今當誦十小呪至功德天呪須誦七遍召請彼天及天眷屬等如誦楞嚴呪及十呪至天女呪亦須誦七徧以召彼天等呪曰南無佛陀南無達摩南無僧伽南無室利摩訶提鼻耶怛儞也他波唎富樓那遮唎三曼陀達舍尼摩訶毗訶羅伽帝三曼陀毗尼伽帝摩訶迦利野波禰波羅波禰薩利嚩栗他三曼陀修鉢梨帝富𨽻那阿夜那達摩帝摩訶毗鼓畢帝摩訶彌勒帝婁簸僧祇帝帝簁僧祇帝三曼陀阿咃何㝹婆囉尼誦已祝延宣疏意叩首起立端身合掌整心殷重存想三寶諸天八部畟塞虗空應現道場方伸供養也七伸供養唱云一切恭敬一心頂禮十方常住三寶一拜已伸白云三寶福田最良祐娑婆界主大梵王摩醯首羅大千主帝釋四王地居天吉祥功德大名稱能與福智辯才仙摩利支天堅牢神密跡散脂韋䭾尊菩提樹神歡喜毋天龍修羅八部眾常護群生心無厭匡持佛法闡威權光明會上諸聖賢不違本誓光臨此惟願衷愍鑒微衷乘佛秘密菩提證唱云是諸眾等各各胡跪嚴持香華如法供養以手擎香華云我此香華徧十方以為微妙光明臺諸天音樂天寶香諸天餚饎天寶衣不可思議妙法塵一一塵出一切塵一一塵出一切法旋轉無礙互莊嚴遍至十方三寶前十方法界三寶前悉有我身修供養一一皆悉徧法界彼彼無襍無障礙盡未來際作佛事普熏法界諸眾生蒙熏皆發菩提心同入無生證佛智即以手散華若不散運想華從空下復擎爐云願此香華雲遍滿十方界供養一切佛尊法諸菩薩聲聞緣覺眾一切諸天仙以起光明臺過於無邊界無邊佛土中受用作佛事普熏諸眾生皆發菩提心起立唱云供養已一切恭敬一體此之香華偈在前第二洒淨道場法下誦亦得次供齋經云早起諸天食今以寅卯二時當供若冬季辰初猶應供供已讚云佛慈廣被德力洪深諸天護世作甘霖災障永無侵願鑒微芹福慧此駢臻南無禪悅藏菩薩摩訶薩三稱若不念佛發願迴向即念供佛齋天殊勝行偈三自歸畢如欲念者當如下作八念佛迴向發願先誦金光明經讚佛偈云佛面猶如淨滿月亦如千日放光明目淨修廣若青蓮齒白齊密猶珂雪佛德無邊如大海無限妙寶積其中智慧德水鎮恒盈百千勝定咸充滿足下輪相皆嚴飾轂輞千輻悉齊平手足縵網遍莊嚴猶如鵝王相具足佛身晃耀等金山清淨殊特無倫匹亦如妙高功德滿故我稽首佛山王相好如空不可測逾於千月放光明皆如焰幻不思議故我稽首心無著讚已稱云南無娑婆世界三界大師四生慈父人天教主千百億化身釋迦牟尼佛南無釋迦牟尼佛隨念多少如常發願迴向禮拜三自歸畢昔人供天多感徵應良由依法盡誠內外潔敬淨處為壇若僧伽藍若阿蘭若閑靜之所或堂殿樓閣治地令淨拂除四壁香水灌灑更用香泥塗拭猶為殊勝安淨供具碗鉢缾器要未經用嚴飾諸座於其座上散諸妙華布以末香燃眾名香并淨燈燭傾心盡意方能感格近見僧俗供天心缺殷重處無嚴淨供具非新飲食不精僅隨世儀而欲希彼聖應豈可得耶既不招賢感聖誠為虗設猶謂所祈無騐自獲謗愆誰當代罪外儀既潔復須淨內三業香湯沐浴著淨潔衣是名身業淨也口不雜言楊枝淨潄是為口業淨也心專懃敬念不散亂是為意業淨也三業既清而且敬則無不格彼天心矣身雖沐浴而不護淨猶未盡善盡美所謂洗淨洗手佛告諸比丘若大小便利不如法洗淨洗手者不應繞塔行道禮佛誦經諸天不喜所持呪法皆無効騐若作齋供書經造像得福寡薄為下品行當墮惡道如佛所說可不慎哉其便利洗淨法詳如餘處附諸天行儀尸棄大梵天王梵華言清淨謂此天王淨持禁戒威儀不缺身心妙圓加以明悟居色界初禪二禪天中間統領梵眾為娑婆世界主尸棄華言頂髻三千大千界內有萬億梵王此處梵王名尸棄居大千界之中以統御為主故名大梵王身長一由旬半壽命一劫半此據六十小劫為一劫半非大劫也大劫共有八十箇小劫經云色界諸天下來聽法六十諸天共坐一針鋒之端亦不迫窄都不相礙由彼色身微妙如諸燈光遞相涉入互相遍到亦無妨礙彼亦如是帝釋天主梵語釋提桓因華言能天主謂能為三十三天主今略云帝釋現身有千頭千眼手持金剛杵流出火炎居須彌山頂善見大城內中央金城殊勝之殿其殿周迴一千五百由旬具足種種妙寶莊嚴映蔽天宮故名殊勝殿上當中重閣圓室廣三十由旬周迴九十由旬高四十五由旬是帝釋所住之處並是瑠璃所成眾寶廁填人間百歲忉利天為一日一夜壽一千歲計人間日月三億六十萬歲三十三天身長二里半帝釋身長五里有二大太子一名栴檀二名修毗羅復有九十億那由他天女并有千子及有諸臣無量共為眷屬帝釋當來成佛號無著尊昔為人時姓憍尸迦與三十二知友共修迦葉佛塔以此功德報為天主三十二人為輔臣合稱三十三天梵語忉利此言三十三一由旬四十里那由他此云萬億北方毗沙門天王梵語毗沙門華言多聞父字婆難陀母名蘇富此天福德名聞最勝居須彌山半之北水精埵有三城一名可畏二名天敬三名眾歸統領無量藥叉羅剎守護北方佛令掌擎古佛舍利塔欲畫其像如陀羅尼集云身著種種天衣嚴飾極令精妙左手執矟拄地右手屈肘擎於佛塔東方提頭賴吒天王梵語提頭賴吒華言持國謂能護持國土父字難陀母字蜜耆盧居須彌山半之東黃金埵城名上賢統領乾闥婆毗舍遮眾守護東方其像天衣嚴飾同前左手伸臂垂下把刀右手屈臂向前仰手掌中著寶寶上出光毗舍遮華言噉精氣鬼南方毗留勒叉天王毗留勒叉華言增長謂能令自他威德善根增長父字和修吉母名漚惙帝居須彌山半之南青瑠璃埵城名善見統領鳩槃茶及薜茘多無量鬼神守護南方其像天衣莊嚴左手同前右手執矟矟根著地鳩槃茶華言魔魅鬼薜茘多華言餓鬼西方毗留博叉天王毗留博叉華言雜語謂能作種種言語又云廣目以其目廣大故父字波羅伽母名漚季畀居須彌山半之西白銀埵城名周羅統領富單那及無量百千諸龍守護西方其像天衣莊嚴左手同前其右手把赤索此四王是欲界初天為八部主人間五十歲此天為一晝夜壽五百歲計人間日月當九百萬歲皆是化生身長五里五分之一四王昔聞佛說法皆證初果各有九十一子姿貌端正同名曰帝有大威力守護十方一王有八將軍周三天下護佛弟子一切山河樹木土地城郭所有鬼皆屬四天王管新經云四天王白佛言世尊我等四王與二十八部藥叉大將并與無量百千藥叉以淨天眼過於世人觀察擁護此贍部州世尊以此因緣我等諸王各為護世者富單那華言臭餓鬼又云主熱病鬼金剛密跡主寶賢大將此天手執金剛杵識達如來一切秘密事迹故以為名寶賢其字也正法念經云昔有國王夫人生一千子欲試當來成佛之次第故拘留孫探得第一籌釋迦得第四籌乃至樓至當千籌第二夫人生二子一願為梵王請千兄轉法輪一願為密迹金剛神護千兄教法領五百藥叉皆大菩薩居須彌山峰護賢劫千佛之法世傳樓至化身非也摩醯首羅天王梵語摩醯首羅華言大自在字威靈帝三目八臂騎白牛執白拂及三股叉居色界頂云是十住菩薩示現統攝大千世界為色界極尊之主光明勝一切能知大千世界雨滴之數有人以為欲界第六天又以為初禪天上大梵王並非也色究竟天身長萬六千由旬壽命一萬六千劫陀羅尼雜集云我摩醯首羅天王神力自在典領三千大千世界鬼神諸王養育守護摧伏外道及諸邪見悉令歸伏安住正法復以神通遊騰十方諸佛國土佐佛揚化我以神呪力六道化身度脫眾生內修菩薩清淨戒行久以得處法流水中八住齊階功德成就波旬魔王天梵語魔羅華言能奪命亦能奪智慧命常為修道者作諸障礙波旬華言惡是釋迦如來出世時魔王名也今居欲界第六天頂宮殿七重縱廣六千由旬身長三里半壽命三萬二千歲人間三千二百年此天為一晝夜往昔為婆羅門時作一無遮大施會故報為欲界主雖為欲界主帝釋四天行佛法事魔不能制涅槃會中亦說呪利益眾生新經云魔王說偈曰若有持此經能伏諸煩惱如是眾生類擁護令安樂若有說是經諸魔不得便由佛威力故我當擁護彼散脂藥叉大將梵語具云散脂修摩華言密謂名行理智四皆密也亦名僧慎爾耶華言正了知陀羅尼集云鬼子母有三男長名唯奢文次名散脂大將手執鉾鑹三名摩尼䟦陀能於十方世界覆護一切眾生為除哀惱等患常地居或居空各有五百眷屬領二十八部藥叉諸神隨是經典所流布處與諸鬼神往至彼所擁護說法者仍以身口意三密而加被之謂以眾味精氣從其毛孔入是身密加被也莊嚴其言辭辯才是口密加被也令其心進勇銳是意密加被也復令聞者受人天樂疾證菩提新金光明經云正了知白佛言世尊何故我名正了知此之因緣是佛親證我知諸法我曉一切法隨所有一切法如所有一切法諸種類體性差別我皆了知我有難思智光我有難思智炬我有難思智行我有難思智聚我於難思境而能通達我於一切法正知正曉能正觀察以是因緣我名正了知以是義故我能令彼說法之師言辭辯了具足莊嚴亦令精氣從毛孔而入身力充足威光勇徤難思智光皆得成就得正憶念無有退屈彼諸眾生聞是經已得不思議大智光明及無量福德之聚當受無量無數大劫人天勝樂永離三途常值諸佛速證無上菩提若男若女於此經中乃至受持一四句頌或持一句或此經王首題名號及此經中一如來名一菩薩名發心稱念恭敬供養者我當救護攝受令無災橫離苦得樂大辯才天謂得大智慧功德成就大辯才也或居山巖山澤深處或居大林葺茅為室結軟草為衣頭上圓髻常翹一足八臂莊嚴手持三戟及日月旗弓箭刀矟斧羂索長杵鐵輪振大鈴鐸帝釋諸天常加供養讚歎具無礙辯於一切時常自護世濟物利生流通佛法新經云若有受持讀誦書寫流布是妙經王如說行者我為是人將諸眷屬作天妓樂來至其所而為擁護除諸病苦惡星疫疾惡夢惡神蠱道魘術饒益是等持經之人及諸聽者皆令速度生死大海至不退菩提大吉祥功德天第一威德成就眾事大功德天於過去佛所種諸善根故感福報相貌殊勝能令眾生福德成就新經云大吉祥天女白佛言世尊北方天王城名有財去城不遠有園名曰妙華福光中有勝殿七寶所成我常住彼我念過去瑠璃金山寶華光照吉祥功德海如來我於彼佛所種諸善根由彼如來威神力故令我今日隨所念處隨所視方隨所至國能令無量百千萬億眾生受諸快樂乃至所須七寶衣服飲食資生之具悉令充足若獨為己身常讀是經供養不絕當以此福普施一切回向菩提願出生死速得解脫按陀羅尼集云功德天像身端正赤白色二臂畫作種種瓔珞環釧耳璫天衣寶冠左手當持如意珠右手施呪無畏當臺上坐此天具足三明六通及八解脫如初地菩薩等無有異為度眾生現作天女見諸眾生輪迴六趣沒溺苦海無有覺者我今愍此諸眾生故以此神呪欲擁護天韋䭾天將韋䭾華言靈感智論要略云天將姓韋名琨乃南方天王八將軍之一為三十二將之首生知聰慧早離塵欲清淨梵行修童真業不染天欲面受佛囑內懷密行外護佛法統衛三洲利物弘化廣濟羣生出家道力微者皆為魔子魔女惑亂將軍悽惶奔趨應機除剪有事須至四天王所王見皆起謂將軍修童真行護正法故也堅牢地神天理體不可壞堅牢如金剛王其利世之功猶如大地持載萬物出生百穀珍寶也地藏經云佛告地神閻浮土地悉蒙汝護凡地所生悉皆豐足利益一切新經云地神白佛言世尊若未來世有演說此經王者我以神力不現本身在於座所頂戴其足我得聞法深心歡喜增益輝光亦令地味悉皆增益乃至四海所有土地亦使肥濃田疇沃壤所有華果苗稼色香具足若諸眾生受用如是勝飲食已長命色力諸根安隱心力勇健又此大地凡有所須百千事業悉皆周備人民熾盛無諸衰惱若有為眾生說是經王一喻一品一昔因緣一如來名一菩薩名一四句頌或復一句乃至首題名字隨所住處其地沃壤過於餘處令諸眾生受於快樂好生慧施心常堅固深信三寶聽斯經者於未來世無量百千億劫天上人中常受勝樂速成無上菩提菩提樹神天菩提華言道謂此神常守護如來成道處菩提之樹因以為名彼自說往昔因中云我常念佛樂見世尊常作誓願不離佛日是知大權示現微妙難思覆護眾生現身利益故諸經讚彼功德實不可量也訶利帝歡喜母訶利帝華言惡賊昔中天竺王舍城內山邊有一娑多藥叉擁護人民於自族類娶妻未久生一女客貌端嚴諸藥又眾見皆歡慶因立名曰歡喜年漸長大時北天竺健陀羅國藥叉半支迦或云德叉伽娶歡喜為妻由彼前身為牧牛女將五百菴沒羅果奉施獨覺發惡願故每語夫曰王舍城人所生男女我欲盡取食之夫屢遮不許後生五百子最小者名曰愛兒女名功德天恃子豪強不受夫諫人生男女取而食之王臣驚恠祭祀不除護城神於夢中告諸人曰汝等男女咸被歡喜藥叉所噉諸人答曰食我男女則是惡賊何名歡喜因此喚為訶利帝時諸人民俱往佛所求作調伏佛以鉢覆其愛兒彼搥胸悲泣天上人間俱覓不見多聞天王教令歸向世尊佛使受戒施他無畏從佛教敕即見愛兒佛為說法遂證須陀洹果亦呼諸子同依佛戒不惱人民西國寺院厨中多設其像事之飲食豐足無缺凡人無子息者求之得子有疾病者禱之則安五百子皆為神王統領萬鬼眾故亦呼為鬼王母也摩利支天摩利支華言陽炎以其形相不可見不可執猶如陽燄護國護民救兵戈等難佛言摩利支天有大神通常在日前行日不見彼彼能見日無人能見無人能知能捉能害乃至不畏怨家若有知彼摩利支天名者彼人亦不可見乃至不為怨家得其便彼天女左手屈臂向上手腕當左乳前作拳拳中把天扇扇如維摩詰前女把扇於扇當中作西國卍字字四曲內各作四箇日形一一著之其扇上作𦦨光形右手伸臂並伸五指指頭垂下若依經作法持彼天呪大有感應神力不可思議也寶光日宮天子城郭天金玻瓈所成縱廣五十一由旬正方如宅遙看似圓宮殿百寶所成輦轝紫金所成高十六由旬天子及眷屬在中受微妙樂城郭宮殿輦轝共有一千光明五百傍照五百下照有五風持轉而行繞須彌山復照四天下除冥破闇成熟萬物此天本因布施修善奉佛得生其中同四天王壽五百歲子孫相繼共住一劫別有無量諸天在日宮前行各受天樂寶光其名也新經云日出放千光無垢燄清淨由此經王力流暉繞四天此經威德力資助於天子日光照及時於此贍部洲田疇諸果藥悉皆令善熟充滿於大地五風一持風二養風三受風四轉風五調風一劫謂一中劫共有二十小劫明月月宮天子城郭天銀及青瑠璃所成縱廣四十九由旬宮殿百寶所成大輦青瑠璃成高十六由旬天子與諸眷屬在中受微妙樂城郭宮殿輦轝共有千光明五百傍照五百下照有五風運持而行繞須彌山腹照四天下陰滋萬物利濟眾生其宿因所修善根亦與日天子同壽五百歲子孫相承共住一劫亦有無量諸天宮殿在月宮前行恒受快樂明月其名也四大電王佛言東方有光明電王名阿揭多南方有光明電王名設羝嚕西方有光明電王名主多光北方有光明電王名蘇多末尼若人得聞如是電王名字及知方處者此人即便遠離一切怖畏之事及諸災橫悉皆消殄若書此四方電王名於所住處無雷電怖亦無災厄及諸障惱非時枉死悉皆遠離娑竭羅無熱惱龍王娑竭羅華言鹹海由海得名即鹹海中一百七十七龍王中之第七龍王是十地大權菩薩示現龍王身隨舉念即布密雲注甘雨普洽天下護法護民其利廣博經云大海中深萬由旬城名戲樂縱廣三千由旬城郭七寶所成有種種華池流水林園瓔珞莊嚴宮殿中有四寶珠能生海內一切珍寶龍王太子閻浮幢之宮殿及八十億諸大龍王宮殿各各差別此龍王宮殿中出紺瑠璃色水入海涌出有時是故大海潮不失時也莊嚴與天無異梵語阿耨達多華言無熱惱從池得名此龍王亦十地菩薩居雪山頂阿耨達池五柱七寶之堂出清涼水給贍部洲利濟眾生時與二萬八千龍王往赴金光明會新經云阿耨達娑揭羅目真𧫦羅葉難陀小難陀於萬千龍中神通具威德共護持經人晝夜常不離蓮華面藥叉王藥叉亦云夜叉華言勇健亦言暴惡又言貴人能飛騰空中有三種一在地二在虗空三在下二天守護城池蓮華面其名也與三萬六千諸藥叉悉皆愛樂如來正法深心護持不生疲懈赴集金光明會新經云寶王滿賢王曠野金毗羅賓度羅黃色此等藥叉王各五百眷屬見聽此經者皆來共擁護彩軍乾闥婆王乾闥婆華言香陰是天帝樂神不食酒肉唯齅香以資身居須彌南金剛窟彩軍其名也深信大乘與諸乾闥婆眾護經護人使佛法流通毗摩質多阿修羅王阿修羅華言非天以其果報最勝鄰次諸天而非天六道之一也男醜女端正有鬼道有畜道鬼道居須彌山窟或大海邊畜道居大海底有胎卵濕化四生毗摩質多居須彌山東去千由旬大海底國土縱廣四萬由旬大城中宮殿名曰設摩啻縱廣一萬由旬七重墻壁七重欄楯七重行樹宮殿園林皆七寶成莊嚴校飾不可述盡須彌山南西北面各過千由旬大海底各有阿修羅城國本身長七百由旬化身高十六萬八千由旬立大海底與須彌山齊常共天鬬敗則與兵眾躲入藕絲孔中毗摩質多其名也毗摩質多此云響高亦云淨心又云種種疑娶香山乾闥婆女生舍脂帝釋取舍脂為第一夫人毗摩質多威勢眷屬不可勝計自餘臣妄左右僕使亦不可計衣食自然百味隨念而有與天同等衣服冠纓純七寶鮮潔誓護正法擁衛持經赴集金光明會新經云婆稚羅睺羅毗摩質多羅母旨苦䟦羅大肩及歡喜并無數天眾來護持經人華嚴感應記云于闐國沙彌般若彌伽薄堅持戒行專誦華嚴經忽一日有人合掌謂曰諸天請師願師閉目俄至天上天帝跪而請曰今方與修羅戰屢被摧衂屈師誦華嚴經望法力加被師乘天輅心念華嚴以諸天眾對彼勍敵修羅見之忽然潰散須臾送歸身染天香終身不滅蘇羅金翅鳥王梵語迦樓羅華言金翅翅翮金色眾彩莊嚴兩翅相去三百六十里亦有相去一十六萬里頭尾相去千由旬高下亦爾頸有如意珠以龍為食惟不能食受三歸八戒龍蘇羅其名也神力最大深樂大乘經典赴集金光明會阿含經云此鳥有四生以如意寶珠為瓔珞變化萬端無事不辨身高四十里衣廣八十里長四十里壽命一劫或有咸者此非鳥王也大海北岸有大樹名俱吒奢摩離高百由旬蔭五十由旬鳥於中住樹之四面有胎卵濕化四生之鳥其鳥翮有毒扇風入人眼即盲故不來人間立須彌山邊鐵樹上香象勢力緊那羅王緊那羅華言疑神似人而頭上有角人見之言人耶非人耶因以名之乃天帝絲竹之伎神亦與諸眷屬赴集金光明會新經云緊那羅樂神蘇羅金翅王大辯及吉祥斯等上首天各領諸天眾常供養諸佛法寶不思議恒生歡喜心於經起恭敬莫呼羅伽王涅槃經云大善見王而為上首亦云摩睺羅伽華言大腹行乃地龍也亦與諸眷屬赴集金光明會閻羅王梵語閻摩羅華言雙王謂兄及妹皆作地獄主兄治男事妹治女事故云雙王又云息諍謂止息罪人諍故經云閻浮提五百由旬下有閻羅王城周帀四面七萬五千由旬又云住獄間城縱廣三萬里城之四面列諸地獄或云是菩薩為利益眾生故變化所作而掌於幽冥正法念處經閻羅王為罪人說偈曰汝得人身不修道如入寶山空手歸汝今自作還自受呌喚苦者欲何為十王經云閻羅王於未來世作佛號普王如來亦與諸眷屬赴集金光明會擁護持經者新經云日月天帝釋風水火諸神吠率怒大肩閻羅辯才等一切諸護世勇猛具威神擁護持經者晝夜常不離凡供齋時誦變食真言二十一徧其真言中三字去聲嚩字當念作伐音或婆字入聲切不可念作字囉字當念作喇邏二字之音切不可念作賴字唵字擡聲從喉中出吽字合口呼音從胸喉中出如牛吼聲或作𠰈字或作虎𤙖二合今有應院作人間法事妄加送天等語然金光明懺法中本無送文即大悲懺法亦有請無送不可妄加以違經旨復增種種喃唱以亂天聽心無專誠意在唱咏必無感應終成虗設
